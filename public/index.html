<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <title>会话工作台</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/workbenches.css">
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#message-input">跳到消息输入框</a>

    <div class="app" id="app">
      <aside class="rail" id="rail" aria-label="会话和组件">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <path d="M4.5 5.5h15v10.75h-9l-4 3.25v-3.25h-2zM8.5 9.5h7M8.5 12.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="brand-name">会话工作台</span>
        </div>

        <div class="rail-sessions">
          <h2 class="rail-heading">会话</h2>
          <button class="new-chat" id="new-chat" type="button">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            新建会话
          </button>
          <p class="rail-label" id="session-list-label">最近会话</p>
          <nav class="session-list" id="session-list" aria-labelledby="session-list-label"></nav>
        </div>

        <div class="rail-components">
          <h2 class="rail-heading">组件</h2>
          <p class="rail-label">工作台插件</p>
          <div class="plugin-list">
            <button class="plugin-link" id="product-plugin" type="button" aria-controls="workbench" aria-expanded="false">
              <span class="plugin-icon plugin-icon--product" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                  <path d="M5.5 6.5h13a1 1 0 0 1 1 1v12h-15v-12a1 1 0 0 1 1-1zm3.5 0v-2h6v2M8 11h8m-8 4h6" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="plugin-label"><span>产品经理工作台</span><small>来源资料、需求简报</small></span>
              <svg class="plugin-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m10 7 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="plugin-link" id="creator-plugin" type="button" aria-controls="workbench" aria-expanded="false">
              <span class="plugin-icon plugin-icon--creator" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                  <path d="M6 19h12M8 15l1-4 7.5-7.5 3 3L12 14zM15.5 4.5l3 3" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="plugin-label"><span>自媒体工作台</span><small>文章起草、编辑与定稿</small></span>
              <svg class="plugin-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m10 7 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <aside class="workbench" id="workbench" aria-label="工作台设置" hidden></aside>

      <main class="chat" id="chat" aria-labelledby="conversation-title">
        <header class="chat-header">
          <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="打开会话和组件" aria-controls="rail" aria-expanded="false">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="chat-heading">
            <h1 id="conversation-title">新会话</h1>
            <span class="connection-status" id="connection-status" role="status">正在检查模型连接</span>
          </div>
          <div class="chat-actions">
            <button class="icon-button" id="rename-chat" type="button" aria-label="重命名会话" title="重命名会话">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m12 5-6.5 6.5L4 19l7.5-1.5L18 11m-6-6 2-2 6 6-2 2m-6-6 6 6M12 19h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="icon-button delete-chat" id="delete-chat" type="button" aria-label="删除会话" title="删除会话">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 7h14m-11 0V4h8v3M7 7l.75 13h8.5L17 7m-6.5 3.5v6m3-6v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </header>

        <div class="messages" id="messages" role="log" aria-label="会话消息" tabindex="0"></div>

        <div class="composer-area">
          <p class="notice" id="notice" role="status" hidden></p>
          <form class="composer" id="composer">
            <label class="visually-hidden" for="message-input">消息</label>
            <textarea id="message-input" rows="2" maxlength="6000" placeholder="输入消息或添加工作说明" aria-describedby="composer-hint" required></textarea>
            <button class="send-message" id="send-message" type="submit" aria-label="发送消息" title="发送消息">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 19V5m-5.5 5.5L12 5l5.5 5.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
          <p class="composer-hint" id="composer-hint">按 Enter 发送，按 Shift + Enter 换行</p>
        </div>
      </main>
    </div>
  </body>
</html>
